        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;

        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: #fff;
        }

        .message-box {
            text-align: center;
            padding: 40px 24px;
            max-width: 600px;
        }

        .message-box h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 12px;
        }

        .message-box p {
            margin-bottom: 24px;
            color: #cbd5e1;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 999px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff;
            text-decoration: none;

<header>
    <div class="logo">Junction</div>
    <nav>
        <a href="../../index.html">Home</a>
